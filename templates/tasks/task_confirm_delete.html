{% extends 'base.html' %}

{% block title %}Delete Task - MidCraft{% endblock %}

{% block content %}
<div class="row justify-content-center mb-4">
    <div class="col-md-8 text-end">
        <a href="{% url 'home_page' %}" class="btn btn-secondary">
            <i class="fas fa-home"></i> Home
        </a>
    </div>
</div>
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h3 class="card-title mb-0">Delete Task</h3>
            </div>
            <div class="card-body text-center">
                <i class="fas fa-exclamation-triangle text-warning fa-4x mb-3"></i>
                <h4>Are you sure you want to delete this task?</h4>
                <p class="lead">"{{ task.title }}"</p>
                <p class="text-muted">This action cannot be undone.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                        <a href="{% url 'task_detail' task.pk %}" class="btn btn-outline-secondary me-md-2">
                            <i class="fas fa-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash"></i> Delete Task
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
