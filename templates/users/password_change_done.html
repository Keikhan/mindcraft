{% extends "base.html" %}

{% block title %}Password Changed - MindCraft{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h2 class="text-center">Password Changed</h2>
            </div>
            <div class="card-body text-center">
                <i class="fas fa-check-circle text-success fa-5x mb-3"></i>
                <p class="lead">Your password has been changed successfully!</p>
                <div class="mt-4">
                    <a href="{% url 'settings' %}" class="btn btn-primary">Back to Settings</a>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-primary ms-2">Go to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
