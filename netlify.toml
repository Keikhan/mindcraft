[build]
  command = "pip install -r requirements.txt && python manage.py collectstatic --noinput"
  publish = "staticfiles/"
  functions = "netlify/functions/"

[build.environment]
  PYTHON_VERSION = "3.10"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/django"
  status = 200

[[plugins]]
  package = "@netlify/plugin-functions-install-core"
